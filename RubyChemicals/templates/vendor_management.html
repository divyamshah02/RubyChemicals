<!DOCTYPE html>
<html>
<head>
    <title>Vendor Management - Ruby Chemicals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background: #f8fafc; }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }
        .btn-primary-custom {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover { background: #2563eb; transform: translateY(-2px); }
        .vendor-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }
        .vendor-card:hover {
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transform: translateY(-4px);
        }
        .vendor-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .vendor-name { font-size: 1.125rem; font-weight: 700; color: #1e293b; }
        .vendor-contact { color: #64748b; font-size: 0.875rem; margin: 0.5rem 0 0; }
        .vendor-detail { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }
        .detail-item { display: flex; align-items: center; gap: 0.5rem; color: #475569; font-size: 0.875rem; }
        .badge-status { padding: 0.375rem 0.75rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }
        .address-item {
            background: #f8fafc;
            border-left: 3px solid #3b82f6;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 6px;
            font-size: 0.875rem;
        }
        .address-type { font-weight: 600; color: #1e293b; }
        .modal-backdrop { background: rgba(0,0,0,0.5); }
        .modal-content { border: none; border-radius: 12px; }
        .form-label { font-weight: 600; color: #1e293b; margin-bottom: 0.5rem; }
        .form-control, .form-select {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.625rem 0.875rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .table-responsive { border-radius: 12px; overflow: hidden; }
        .table { margin-bottom: 0; }
        .table thead { background: #f1f5f9; }
        .table th { font-weight: 600; color: #475569; border: none; padding: 1rem; }
        .table td { padding: 1rem; border-color: #e2e8f0; }
        .action-buttons { display: flex; gap: 0.5rem; }
        .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
    </style>
</head>
<body>
    {% include 'header.html' %}

    <div class="container-fluid mt-4">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-dolly" style="color: #3b82f6; margin-right: 0.75rem;"></i>Vendor Management</h1>
            <button class="btn-primary-custom" onclick="openAddVendorModal()">
                <i class="fas fa-plus" style="margin-right: 0.5rem;"></i> Add New Vendor
            </button>
        </div>

        <!-- Search Bar -->
        <div style="margin-bottom: 2rem;">
            <input type="text" id="searchInput" placeholder="Search by company name, contact person, or email..." 
                   style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem;">
        </div>

        <!-- Vendors List -->
        <div id="vendorsList" style="min-height: 400px;">
            <div class="text-center text-muted py-5">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                <p>Loading vendors...</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Vendor Modal -->
    <div class="modal fade" id="vendorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="border-bottom: 1px solid #e2e8f0;">
                    <h5 class="modal-title" id="modalTitle">Add New Vendor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Company Name *</label>
                        <input type="text" class="form-control" id="companyName" placeholder="Enter company name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contact Person *</label>
                        <input type="text" class="form-control" id="contactPerson" placeholder="Enter contact person name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email address">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone *</label>
                        <input type="text" class="form-control" id="phone" placeholder="Enter phone number">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">GST No</label>
                        <input type="text" class="form-control" id="gstNo" placeholder="Enter GST number">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" rows="3" placeholder="Any additional notes..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="isActive">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #e2e8f0;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveVendor()">Save Vendor</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Address Modal -->
    <div class="modal fade" id="addressModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="border-bottom: 1px solid #e2e8f0;">
                    <h5 class="modal-title" id="addressModalTitle">Add Address</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Address Type *</label>
                        <select class="form-select" id="addressType">
                            <option value="shipping">Shipping</option>
                            <option value="billing">Billing</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Street *</label>
                        <input type="text" class="form-control" id="street" placeholder="Enter street address">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">City *</label>
                        <input type="text" class="form-control" id="city" placeholder="Enter city">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">State *</label>
                        <input type="text" class="form-control" id="state" placeholder="Enter state">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Postal Code *</label>
                        <input type="text" class="form-control" id="postalCode" placeholder="Enter postal code">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-control" id="country" value="India">
                    </div>
                    <div class="mb-3">
                        <label class="form-check-label">
                            <input type="checkbox" class="form-check-input" id="isDefault">
                            Set as default address
                        </label>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #e2e8f0;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveAddress()">Save Address</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Vendor Modal -->
    <div class="modal fade" id="viewVendorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="border-bottom: 1px solid #e2e8f0;">
                    <h5 class="modal-title">Vendor Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div><strong>Company Name:</strong></div>
                            <div id="viewCompanyName" style="color: #64748b; margin-bottom: 1rem;"></div>
                            
                            <div><strong>Contact Person:</strong></div>
                            <div id="viewContactPerson" style="color: #64748b; margin-bottom: 1rem;"></div>
                            
                            <div><strong>Email:</strong></div>
                            <div id="viewEmail" style="color: #64748b; margin-bottom: 1rem;"></div>
                        </div>
                        <div class="col-md-6">
                            <div><strong>Phone:</strong></div>
                            <div id="viewPhone" style="color: #64748b; margin-bottom: 1rem;"></div>
                            
                            <div><strong>GST No:</strong></div>
                            <div id="viewGST" style="color: #64748b; margin-bottom: 1rem;"></div>
                            
                            <div><strong>Status:</strong></div>
                            <div id="viewStatus" style="margin-bottom: 1rem;"></div>
                        </div>
                    </div>
                    
                    <div id="viewNotes" style="margin-top: 1.5rem; display: none;">
                        <strong>Notes:</strong>
                        <div id="viewNotesText" style="color: #64748b; margin-top: 0.5rem; padding: 0.75rem; background: #f1f5f9; border-radius: 6px;"></div>
                    </div>
                    
                    <div id="addressesSection" style="margin-top: 2rem;">
                        <h6 style="font-weight: 700; margin-bottom: 1rem;">Addresses</h6>
                        <div id="viewAddresses">
                            <p class="text-muted">No addresses added</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #e2e8f0;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script>
        const VENDOR_API = "/operation-api/vendor-api/";
        const ADDRESS_API = "/operation-api/vendor-address-api/";
        let currentVendorId = null;
        let currentAddressId = null;
        let vendors = [];

        async function loadVendors(query = "") {
            const url = query ? VENDOR_API + "search/?q=" + encodeURIComponent(query) : VENDOR_API;
            const [ok, res] = await callApi("GET", url);
            
            if (ok && res.data) {
                vendors = res.data;
                renderVendors();
            }
        }

        function renderVendors() {
            const container = document.getElementById("vendorsList");
            
            if (vendors.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-5"><p>No vendors found</p></div>';
                return;
            }

            container.innerHTML = vendors.map(vendor => `
                <div class="vendor-card">
                    <div class="vendor-header">
                        <div>
                            <div class="vendor-name">${vendor.company_name}</div>
                            <div class="vendor-contact"><i class="fas fa-user"></i> ${vendor.contact_person}</div>
                        </div>
                        <span class="badge-status ${vendor.is_active ? 'badge-active' : 'badge-inactive'}">
                            ${vendor.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                    <div class="vendor-detail">
                        <div class="detail-item">
                            <i class="fas fa-envelope"></i>
                            <span>${vendor.email || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-phone"></i>
                            <span>${vendor.phone}</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-sm btn-info" onclick="viewVendor(${vendor.id})">
                            <i class="fas fa-eye"></i> View
                        </button>
                        <button class="btn btn-sm btn-success" onclick="openAddressModal(${vendor.id})">
                            <i class="fas fa-map-pin"></i> Add Address
                        </button>
                        <button class="btn btn-sm btn-warning" onclick="editVendor(${vendor.id})">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteVendor(${vendor.id})">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `).join("");
        }

        async function viewVendor(vendorId) {
            const [ok, res] = await callApi("GET", VENDOR_API + vendorId + "/");
            
            if (ok && res.data) {
                const vendor = res.data;
                
                document.getElementById("viewCompanyName").textContent = vendor.company_name;
                document.getElementById("viewContactPerson").textContent = vendor.contact_person;
                document.getElementById("viewEmail").textContent = vendor.email || "N/A";
                document.getElementById("viewPhone").textContent = vendor.phone;
                document.getElementById("viewGST").textContent = vendor.gst_no || "N/A";
                document.getElementById("viewStatus").innerHTML = vendor.is_active 
                    ? '<span style="background: #dcfce7; color: #15803d; padding: 0.25rem 0.75rem; border-radius: 4px;">Active</span>'
                    : '<span style="background: #fee2e2; color: #991b1b; padding: 0.25rem 0.75rem; border-radius: 4px;">Inactive</span>';
                
                if (vendor.notes) {
                    document.getElementById("viewNotes").style.display = "block";
                    document.getElementById("viewNotesText").textContent = vendor.notes;
                } else {
                    document.getElementById("viewNotes").style.display = "none";
                }
                
                if (vendor.addresses && vendor.addresses.length > 0) {
                    let addressHtml = '';
                    vendor.addresses.forEach(addr => {
                        addressHtml += `
                    <div style="padding: 0.75rem; background: #f8fafc; border-radius: 6px; margin-bottom: 0.75rem; border: 1px solid #e2e8f0;">
                                <div style="font-weight: 600; color: #1e293b; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                                    <span>${addr.address_type.toUpperCase()} ${addr.is_default ? '<span style="background: #3b82f6; color: white; padding: 0.25rem 0.5rem; border-radius: 3px; font-size: 0.75rem;">Default</span>' : ''}</span>
                                    <div>
                                        <button class="btn btn-sm btn-warning" onclick="editAddress(${addr.id}, ${vendor.id})" style="margin-right: 0.25rem;">
                                            <i class="fas fa-edit"></i> Edit
                                        </button>
                                        <button class="btn btn-sm btn-danger" onclick="deleteAddress(${addr.id}, ${vendor.id})">
                                            <i class="fas fa-trash"></i> Delete
                                        </button>
                                    </div>
                                </div>
                                <div style="color: #64748b; font-size: 0.875rem;">
                                    ${addr.street}<br>
                                    ${addr.city}, ${addr.state} ${addr.postal_code}<br>
                                    ${addr.country}
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById("viewAddresses").innerHTML = addressHtml;
                } else {
                    document.getElementById("viewAddresses").innerHTML = '<p class="text-muted">No addresses added</p>';
                }
                
                const modal = new bootstrap.Modal(document.getElementById("viewVendorModal"));
                modal.show();
            } else {
                alert("Error loading vendor details");
            }
        }

        function openAddVendorModal() {
            currentVendorId = null;
            document.getElementById("modalTitle").textContent = "Add New Vendor";
            document.getElementById("companyName").value = "";
            document.getElementById("contactPerson").value = "";
            document.getElementById("email").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("gstNo").value = "";
            document.getElementById("notes").value = "";
            document.getElementById("isActive").value = "true";
            
            const modal = new bootstrap.Modal(document.getElementById("vendorModal"));
            modal.show();
        }

        async function editVendor(vendorId) {
            const [ok, res] = await callApi("GET", VENDOR_API + vendorId + "/");
            
            if (ok && res.data) {
                const vendor = res.data;
                currentVendorId = vendorId;
                
                document.getElementById("modalTitle").textContent = "Edit Vendor";
                document.getElementById("companyName").value = vendor.company_name;
                document.getElementById("contactPerson").value = vendor.contact_person;
                document.getElementById("email").value = vendor.email || "";
                document.getElementById("phone").value = vendor.phone;
                document.getElementById("gstNo").value = vendor.gst_no || "";
                document.getElementById("notes").value = vendor.notes || "";
                document.getElementById("isActive").value = vendor.is_active ? "true" : "false";
                
                const modal = new bootstrap.Modal(document.getElementById("vendorModal"));
                modal.show();
            }
        }

        async function saveVendor() {
            const payload = {
                company_name: document.getElementById("companyName").value,
                contact_person: document.getElementById("contactPerson").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                gst_no: document.getElementById("gstNo").value,
                notes: document.getElementById("notes").value,
                is_active: document.getElementById("isActive").value === "true"
            };

            const method = currentVendorId ? "PUT" : "POST";
            const url = currentVendorId ? VENDOR_API + currentVendorId + "/" : VENDOR_API;
            
            const [ok, res] = await callApi(method, url, payload, "{{csrf_token}}");
            
            if (ok) {
                bootstrap.Modal.getInstance(document.getElementById("vendorModal")).hide();
                loadVendors();
            } else {
                alert("Error saving vendor: " + JSON.stringify(res.error));
            }
        }

        async function deleteVendor(vendorId) {
            if (confirm("Are you sure you want to delete this vendor?")) {
                const [ok, res] = await callApi("DELETE", VENDOR_API + vendorId + "/", null, "{{csrf_token}}");
                
                if (ok) {
                    loadVendors();
                } else {
                    alert("Error deleting vendor");
                }
            }
        }

        function openAddressModal(vendorId) {
            currentVendorId = vendorId;
            currentAddressId = null;
            document.getElementById("addressModalTitle").textContent = "Add Address";
            document.getElementById("addressType").value = "shipping";
            document.getElementById("street").value = "";
            document.getElementById("city").value = "";
            document.getElementById("state").value = "";
            document.getElementById("postalCode").value = "";
            document.getElementById("country").value = "India";
            document.getElementById("isDefault").checked = false;
            
            const modal = new bootstrap.Modal(document.getElementById("addressModal"));
            modal.show();
        }

        async function editAddress(addressId, vendorId) {
            const [ok, res] = await callApi("GET", ADDRESS_API + addressId + "/");
            
            if (ok && res.data) {
                const address = res.data;
                currentAddressId = addressId;
                currentVendorId = vendorId;
                
                document.getElementById("addressModalTitle").textContent = "Edit Address";
                document.getElementById("addressType").value = address.address_type;
                document.getElementById("street").value = address.street;
                document.getElementById("city").value = address.city;
                document.getElementById("state").value = address.state;
                document.getElementById("postalCode").value = address.postal_code;
                document.getElementById("country").value = address.country;
                document.getElementById("isDefault").checked = address.is_default;
                
                const modalEl = document.getElementById("viewVendorModal");
                const modalInstance = bootstrap.Modal.getInstance(modalEl);

                if (modalInstance) {
                    modalInstance.hide();
                }

                const modal = new bootstrap.Modal(document.getElementById("addressModal"));
                modal.show();
            } else {
                alert("Error loading address details");
            }
        }

        async function saveAddress() {
            const payload = {
                vendor: currentVendorId,
                address_type: document.getElementById("addressType").value,
                street: document.getElementById("street").value,
                city: document.getElementById("city").value,
                state: document.getElementById("state").value,
                postal_code: document.getElementById("postalCode").value,
                country: document.getElementById("country").value,
                is_default: document.getElementById("isDefault").checked
            };

            const method = currentAddressId ? "PUT" : "POST";
            const url = currentAddressId ? ADDRESS_API + currentAddressId + "/" : ADDRESS_API;

            const [ok, res] = await callApi(method, url, payload, "{{csrf_token}}");
            
            if (ok) {
                bootstrap.Modal.getInstance(document.getElementById("addressModal")).hide();
                loadVendors();
            } else {
                alert("Error saving address: " + JSON.stringify(res.error));
            }
        }

        async function deleteAddress(addressId, vendorId) {
            if (confirm("Are you sure you want to delete this address?")) {
                toggle_loader()
                const [ok, res] = await callApi("DELETE", ADDRESS_API + addressId + "/", null, "{{csrf_token}}");
                
                if (ok) {
                    
                    await loadVendors();
                    const modalEl = document.getElementById("addressModal");
                    const modalInstance = bootstrap.Modal.getInstance(modalEl);

                    if (modalInstance) {
                        modalInstance.hide();
                    }

                    viewVendor(vendorId)
                    toggle_loader()

                } else {
                    toggle_loader()
                    alert("Error deleting address");
                }
            }
        }

        // Search functionality
        document.getElementById("searchInput").addEventListener("keyup", (e) => {
            loadVendors(e.target.value);
        });

        // Load vendors on page load
        loadVendors();
    </script>
</body>
</html>
