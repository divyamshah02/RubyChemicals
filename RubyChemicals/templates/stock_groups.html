<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Groups - Ruby Chemicals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    
</head>

<body>
    {% include 'header.html' %}
    <div class="container">
        <h4><i class="fas fa-layer-group" style="color: #3b82f6;"></i> Stock Groups</h4>
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addGroupModal">
            <i class="fas fa-plus"></i> Add Stock Group
        </button>

        <table class="table" id="groupTable"></table>
    </div>

    <!-- Add Group Modal -->
    <div class="modal fade" id="addGroupModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-layer-group" style="color: #3b82f6;"></i> Add Stock Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="groupName">Group Name</label>
                    <input id="groupName" class="form-control" placeholder="Enter group name" autocomplete="off">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="createGroup()">
                        <i class="fas fa-save"></i> Save Group
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/stock_groups.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script>
        init("{{csrf_token}}", {
            list: "/operation-api/stock-group-api/",
            create: "/operation-api/stock-group-api/"
        })
    </script>
  </div>
</nav>

</body>

</html>
