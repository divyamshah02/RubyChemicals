<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/js_1/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Stock Groups - Ruby Chemicals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css_1/style.css">
    <link rel="stylesheet" href="/static/css_1/portal.css">
    <script src="/static/js_1/portal.js" defer></script>
    
</head>

<body>
    {% include 'header.html' %}
    <div class="container-fluid">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-layer-group"></i>Stock Groups</h1>
            <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addGroupModal">
                <i class="fas fa-plus me-1"></i>Add Stock Group
            </button>
        </div>

        <div class="table-container">
            <table class="table" id="groupTable"></table>
        </div>
    </div>

    <!-- Add Group Modal -->
    <div class="modal fade" id="addGroupModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-layer-group" style="color: #3b82f6;"></i> Add Stock Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="groupName" class="form-label">Group Name</label>
                    <input id="groupName" class="form-control" placeholder="Enter group name" autocomplete="off">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success-custom" onclick="createGroup()">
                        <i class="fas fa-save"></i> Save Group
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js_1/stock_groups.js"></script>
    <script src="/static/js_1/api_caller.js"></script>
    <script>
        init("{{csrf_token}}", {
            list: "/operation-api/stock-group-api/",
            create: "/operation-api/stock-group-api/"
        })
    </script>
  </div>
</nav>

</body>

</html>
