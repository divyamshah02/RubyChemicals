<!DOCTYPE html>
<html>
<head>
    <title>Role Manager - Ruby Chemicals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background: #f8fafc; }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }
        .table { margin: 0; }
        .table thead {
            background: #f1f5f9;
            border-bottom: 2px solid #e2e8f0;
        }
        .table thead th {
            color: #475569;
            font-weight: 600;
            padding: 0.875rem 1rem;
            border: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            white-space: nowrap;
        }
        .table tbody td {
            padding: 0.875rem 1rem;
            border-color: #e2e8f0;
            vertical-align: middle;
            color: #475569;
            font-size: 0.875rem;
        }
        .table tbody tr { transition: background 0.15s; }
        .table tbody tr:hover { background: #f8fafc; }

        .user-id-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: .3rem .65rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .role-badge {
            padding: .3rem .7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .role-admin      { background:#fef3c7; color:#92400e; }
        .role-accounts   { background:#d1fae5; color:#065f46; }
        .role-factory    { background:#e0e7ff; color:#3730a3; }
        .role-accountant { background:#fce7f3; color:#831843; }
        .role-office     { background:#e0f2fe; color:#075985; }

        .perm-chip {
            display: inline-block;
            background: #e2e8f0;
            color: #64748b;
            padding: .2rem .55rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin: 2px 2px;
        }
        .perm-chip.active {
            background: #dcfce7;
            color: #166534;
        }
        .perm-chip.super {
            background: #fce7f3;
            color: #831843;
        }

        .action-buttons { display: flex; gap: .4rem; }
        .action-buttons .btn {
            padding: .3rem .65rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .modal-content { border-radius: 12px; border: 1px solid #e2e8f0; }
        .modal-header  { background: #f1f5f9; border-bottom: 1px solid #e2e8f0; border-radius: 12px 12px 0 0; }
        .modal-title   { font-weight: 700; color: #1e293b; }

        .perm-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-top: .75rem;
        }
        .perm-section h6 {
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: .75rem;
        }
        .form-check-label { font-size: 0.875rem; }

        .super-admin-banner {
            background: #fdf2f8;
            border: 1px solid #f9a8d4;
            border-radius: 8px;
            padding: .65rem 1rem;
            color: #831843;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: .5rem;
        }
        .super-admin-banner i { margin-right: .4rem; }

        /* Filters bar */
        .filters-bar {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            align-items: center;
        }
        .filters-bar .form-control,
        .filters-bar .form-select {
            font-size: 0.875rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .stat-pill {
            background: #f1f5f9;
            border-radius: 20px;
            padding: .3rem .85rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }
        .stat-pill span { color: #1e293b; }
    </style>
</head>
<body>

{% include 'header.html' %}

<div class="container-fluid" style="padding: 2rem 1.5rem;">

    <!-- Page Header -->
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-users-cog" style="margin-right:.75rem; color:#3b82f6;"></i>Role Manager
        </h1>
        <div class="d-flex gap-2 align-items-center">
            <span class="stat-pill">Total: <span id="statTotal">—</span></span>
            <span class="stat-pill">Active: <span id="statActive">—</span></span>
            <button class="btn btn-primary" style="border-radius:8px;" onclick="openCreateModal()">
                <i class="fas fa-plus" style="margin-right:.4rem;"></i>Add User
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <input  id="filterSearch" class="form-control" style="max-width:240px;" placeholder="Search name or email…" oninput="applyFilters()">
        <select id="filterRole"   class="form-select"  style="max-width:160px;" onchange="applyFilters()">
            <option value="">All Roles</option>
            <option value="admin">Admin</option>
            <option value="accounts">Accounts</option>
            <option value="factory">Factory</option>
            <option value="accountant">Accountant</option>
            <option value="office">Office</option>
        </select>
        <select id="filterStatus" class="form-select"  style="max-width:160px;" onchange="applyFilters()">
            <option value="">All Status</option>
            <option value="true">Active</option>
            <option value="false">Inactive</option>
        </select>
        <select id="filterSuper"  class="form-select"  style="max-width:180px;" onchange="applyFilters()">
            <option value="">All Types</option>
            <option value="true">Super Admin</option>
            <option value="false">Regular Users</option>
        </select>
        <button class="btn btn-outline-secondary btn-sm" style="border-radius:8px;" onclick="clearFilters()">
            <i class="fas fa-times"></i> Clear
        </button>
    </div>

    <!-- Table -->
    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-hover" id="usersTable">
                <thead>
                    <tr>
                        <th><i class="fas fa-id-badge"></i> User ID</th>
                        <th><i class="fas fa-user"></i> Name</th>
                        <th><i class="fas fa-envelope"></i> Email</th>
                        <th><i class="fas fa-tag"></i> Role</th>
                        <th><i class="fas fa-shield-alt"></i> Permissions</th>
                        <th><i class="fas fa-circle"></i> Status</th>
                        <th><i class="fas fa-calendar"></i> Created</th>
                        <th style="width:150px;"><i class="fas fa-cogs"></i> Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="8" class="text-center text-muted py-5">
                        <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;"></i>
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>


<!-- ═══════════════════════════════════════════
     CREATE USER MODAL
════════════════════════════════════════════ -->
<div class="modal fade" id="createUserModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus" style="color:#3b82f6;margin-right:.5rem;"></i>Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                        <input id="createName" class="form-control" placeholder="e.g. John Doe" autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input id="createEmail" class="form-control" type="email" placeholder="john@example.com" autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input id="createPassword" class="form-control" type="password" placeholder="Min. 6 characters" autocomplete="new-password">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
                        <select id="createRole" class="form-select">
                            <option value="admin">Admin</option>
                            <option value="accounts">Accounts</option>
                            <option value="factory">Factory</option>
                            <option value="accountant">Accountant</option>
                            <option value="office">Office</option>
                        </select>
                    </div>
                </div>

                <!-- Permissions -->
                <div class="perm-section mt-3">
                    <h6><i class="fas fa-key" style="margin-right:.4rem;"></i>Module Permissions</h6>

                    <!-- Super Admin toggle -->
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="createIsSuperAdmin" onchange="toggleSuperAdmin('create')">
                        <label class="form-check-label fw-semibold" for="createIsSuperAdmin" style="color:#831843;">
                            <i class="fas fa-crown"></i> Super Admin — overrides all permissions below
                        </label>
                    </div>

                    <div id="createPluginsSection">
                        <div class="row g-2 mt-1" id="createPlugins">
                            <!-- rendered by JS -->
                        </div>
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" onclick="submitCreateUser()">
                    <i class="fas fa-save" style="margin-right:.4rem;"></i>Create User
                </button>
            </div>
        </div>
    </div>
</div>


<!-- ═══════════════════════════════════════════
     EDIT USER MODAL
════════════════════════════════════════════ -->
<div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-edit" style="color:#f59e0b;margin-right:.5rem;"></i>Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editUserId">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input id="editName" class="form-control" autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input id="editEmail" class="form-control" type="email" autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Role</label>
                        <select id="editRole" class="form-select">
                            <option value="admin">Admin</option>
                            <option value="accounts">Accounts</option>
                            <option value="factory">Factory</option>
                            <option value="accountant">Accountant</option>
                            <option value="office">Office</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Status</label>
                        <select id="editActiveUser" class="form-select">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                </div>

                <!-- Permissions -->
                <div class="perm-section mt-3">
                    <h6><i class="fas fa-key" style="margin-right:.4rem;"></i>Module Permissions</h6>
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="editIsSuperAdmin" onchange="toggleSuperAdmin('edit')">
                        <label class="form-check-label fw-semibold" for="editIsSuperAdmin" style="color:#831843;">
                            <i class="fas fa-crown"></i> Super Admin — overrides all permissions below
                        </label>
                    </div>
                    <div class="row g-2 mt-1" id="editPlugins">
                        <!-- rendered by JS -->
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-warning text-white" onclick="submitEditUser()">
                    <i class="fas fa-save" style="margin-right:.4rem;"></i>Save Changes
                </button>
            </div>
        </div>
    </div>
</div>


<!-- ═══════════════════════════════════════════
     CHANGE PASSWORD MODAL
════════════════════════════════════════════ -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-key" style="color:#8b5cf6;margin-right:.5rem;"></i>Change Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cpUserId">
                <p id="cpUserLabel" class="text-muted mb-3" style="font-size:.875rem;"></p>
                <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                <input id="cpNewPassword" class="form-control" type="password" placeholder="Min. 6 characters" autocomplete="new-password">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="submitChangePassword()">
                    <i class="fas fa-save" style="margin-right:.4rem;"></i>Update Password
                </button>
            </div>
        </div>
    </div>
</div>


<!-- ═══════════════════════════════════════════
     DELETE CONFIRM MODAL
════════════════════════════════════════════ -->
<div class="modal fade" id="deleteUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background:#fef2f2;">
                <h5 class="modal-title text-danger"><i class="fas fa-trash" style="margin-right:.5rem;"></i>Delete User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="delUserId">
                <p class="mb-0">Are you sure you want to delete <strong id="delUserName"></strong>? This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger" onclick="submitDeleteUser()">
                    <i class="fas fa-trash" style="margin-right:.4rem;"></i>Delete
                </button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/api_caller.js"></script>
<script src="/static/js/role_manager.js"></script>
<script>
    const CSRF_TOKEN = "{{ csrf_token }}";
    const ENDPOINTS  = {
        users: "{% url 'user-api-list' %}",
        userDetail: "{% url 'user-api-list' %}",   // append {id}/ for detail
    };
    initRoleManager(CSRF_TOKEN, ENDPOINTS);
</script>
</body>
</html>
