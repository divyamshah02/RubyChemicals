<!DOCTYPE html>
<html>

<head>
    <title>Dispatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    {% include 'header.html' %}

    <div class="container mt-4">
        <h4>Dispatch</h4>

        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#dispatchModal">
            Create Dispatch
        </button>

        <table class="table table-bordered" id="dispatchTable"></table>
    </div>

    <!-- Dispatch Modal -->
    <div class="modal fade" id="dispatchModal">
        <div class="modal-dialog">
            <div class="modal-content p-3">

                <h5>Create Dispatch</h5>

                <label>Product</label>
                <select id="dispatchItem" class="form-control mb-2"></select>

                <input id="dispatchQty" class="form-control mb-2" placeholder="Quantity">
                <input id="dispatchCustomer" class="form-control mb-2" placeholder="Customer Name">
                <input id="dispatchDate" type="date" class="form-control mb-2">

                <button class="btn btn-success" onclick="createDispatch()">Save</button>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/dispatch.js"></script>
    <script>
        init("{{csrf_token}}", {
            dispatch: "/operation-api/dispatch-api/",
            stock: "/operation-api/stock-item-api/"
        })
    </script>

  </div>
</nav>

</body>

</html>
