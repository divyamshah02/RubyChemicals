<!DOCTYPE html>
<html>

<head>
    <title>Production - Ruby Chemicals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    {% include 'header.html' %}

    <div class="container">
        <h4><i class="fas fa-industry" style="color: #3b82f6;"></i> Production Management</h4>

        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#productionCardModal">
            <i class="fas fa-plus"></i> Create Production Card
        </button>

        <table class="table" id="batchTable"></table>
    </div>

    <!-- Production Card Modal with Batches -->
    <div class="modal fade" id="productionCardModal">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-industry" style="color: #3b82f6;"></i> Create Production Card with Batches</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="max-height: 85vh; overflow-y: auto;">
                    <!-- Card Info Section -->
                    <div style="background: #f0f9ff; padding: 1.5rem; border-radius: 10px; margin-bottom: 2rem;">
                        <h6 style="color: #1e40af; font-weight: 700; margin-bottom: 1rem;"><i class="fas fa-id-card"></i> Card Information</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <label for="productionCode">Production Code</label>
                                <input id="productionCode" class="form-control mb-3" placeholder="e.g., PROD-001" autocomplete="off">
                            </div>
                            <div class="col-md-6">
                                <label for="productionDate">Production Date</label>
                                <input id="productionDate" type="date" class="form-control mb-3">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <label for="totalOutputQty">Total Output Qty</label>
                                <input id="totalOutputQty" type="number" class="form-control mb-3" placeholder="0" autocomplete="off">
                            </div>
                            <div class="col-md-6">
                                <label for="unitSelect">Unit of Measurement</label>
                                <select id="unitSelect" class="form-control mb-3">
                                    <option value="kg">Kilogram (KG)</option>
                                    <option value="g">Gram (g)</option>
                                    <option value="pcs">Pieces (Pcs)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Raw Materials Section -->
                    <hr style="border-color: #e2e8f0;">
                    <h6 style="color: #1e40af; font-weight: 700; margin-bottom: 1rem;"><i class="fas fa-flask"></i> Raw Materials</h6>
                    <div id="rawList" style="background: #fafafa; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;"></div>
                    <button class="btn btn-secondary btn-sm mb-3" onclick="addRawMaterialRow()"><i class="fas fa-plus"></i> Add Material</button>

                    <!-- Batches Section -->
                    <hr style="border-color: #e2e8f0;">
                    <h6 style="color: #1e40af; font-weight: 700; margin-bottom: 1rem;"><i class="fas fa-cubes"></i> Production Batches</h6>
                    <div id="batchesList" style="background: #fafafa; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;"></div>
                    <button class="btn btn-primary btn-sm" onclick="addBatchRow()"><i class="fas fa-plus"></i> Add Batch</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="createProductionCardWithBatches()"><i class="fas fa-save"></i> Save Card & Batches</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Production Card Detail Modal -->
    <div class="modal fade" id="productionDetailModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-industry" style="color: #3b82f6;"></i> Production Card Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="cardDetailsContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/production.js"></script>
    <script>
        init("{{csrf_token}}", {
            productionCard: "/operation-api/production-card-api/",
            productionBatch: "/operation-api/production-batch-api/",
            stock: "/operation-api/stock-item-api/"
        })

        // Initialize when card modal opens
        const productionCardModal = document.getElementById("productionCardModal")
        productionCardModal.addEventListener("show.bs.modal", function(){
          const rawList = document.getElementById("rawList")
          const batchesList = document.getElementById("batchesList")
          if(rawList.innerHTML === ""){
            addRawMaterialRow()
          }
          if(batchesList.innerHTML === ""){
            addBatchRow()
          }
        })

        // Clear form when card modal closes
        productionCardModal.addEventListener("hide.bs.modal", function(){
          document.getElementById("productionCode").value = ""
          document.getElementById("productionDate").value = ""
          document.getElementById("totalOutputQty").value = ""
          document.getElementById("unitSelect").value = "kg"
          document.getElementById("rawList").innerHTML = ""
          document.getElementById("batchesList").innerHTML = ""
        })
    </script>

  </div>
</nav>

</body>

</html>
