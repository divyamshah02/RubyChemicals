<!DOCTYPE html>
<html>

<head>
    <title>Production</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    {% include 'header.html' %}

    <div class="container mt-4">
        <h4>Production</h4>

        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#productionModal">
            Create Production
        </button>

        <table class="table table-bordered" id="productionTable"></table>
    </div>

    <!-- Production Modal -->
    <div class="modal fade" id="productionModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content p-3">

                <h5>Create Production</h5>

                <input id="batchCode" class="form-control mb-2" placeholder="Batch Code">
                <input id="productionDate" type="date" class="form-control mb-2">

                <label>Finished Product</label>
                <select id="productSelect" class="form-control mb-2"></select>

                <input id="outputQty" class="form-control mb-2" placeholder="Output Quantity">
                <input id="lossQty" class="form-control mb-2" placeholder="Loss Quantity">

                <hr>
                <h6>Raw Materials</h6>
                <div id="rawList"></div>

                <button class="btn btn-secondary btn-sm mt-2" onclick="addRow()">Add Material</button>
                <br><br>
                <button class="btn btn-success" onclick="createProduction()">Save Production</button>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/production.js"></script>
    <script>
        init("{{csrf_token}}", {
            production: "/operation-api/production-api/",
            stock: "/operation-api/stock-item-api/"
        })
    </script>

  </div>
</nav>

</body>

</html>
