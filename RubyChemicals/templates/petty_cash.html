<!DOCTYPE html>
<html>

<head>
    <title>Petty Cash - Ruby Chemicals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">    

</head>

<body>

    {% include 'header.html' %}

    <div class="container">
        <h4><i class="fas fa-wallet" style="color: #3b82f6;"></i> Petty Cash Management</h4>

        <div style="display: flex; gap: 10px; margin-bottom: 2rem;">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal">
                <i class="fas fa-plus"></i> Add Expense
            </button>

            <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#headModal">
                <i class="fas fa-tag"></i> Add Expense Head
            </button>
        </div>

        <table class="table" id="expenseTable"></table>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal fade" id="expenseModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-receipt" style="color: #3b82f6;"></i> Add Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="expenseHead">Expense Head</label>
                    <select id="expenseHead" class="form-control mb-3"></select>
                    <label for="expenseAmount">Amount (₹)</label>
                    <input id="expenseAmount" class="form-control mb-3" placeholder="0.00" autocomplete="off">
                    <label for="expenseDate">Expense Date</label>
                    <input id="expenseDate" type="date" class="form-control mb-3">
                    <label for="expenseNotes">Notes (Optional)</label>
                    <input id="expenseNotes" class="form-control" placeholder="Add any notes here..." autocomplete="off">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="createExpense()"><i class="fas fa-save"></i> Save Expense</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Expense Head Modal -->
    <div class="modal fade" id="headModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-tag" style="color: #3b82f6;"></i> Add Expense Head</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="newHead">Head Name</label>
                    <input id="newHead" class="form-control" placeholder="e.g., Utilities, Office Supplies..." autocomplete="off">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="createHead()"><i class="fas fa-save"></i> Save Head</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/petty_cash.js"></script>
    <script>
        init("{{csrf_token}}", {
            cash: "/operation-api/petty-cash-api/",
            heads: "/operation-api/expense-head-api/"
        })
    </script>

  </div>
</nav>

</body>

</html>
