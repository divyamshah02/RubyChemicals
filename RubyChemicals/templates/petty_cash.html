<!DOCTYPE html>
<html>

<head>
    <title>Petty Cash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">    

</head>

<body>

    {% include 'header.html' %}

    <div class="container mt-4">
        <h4>Petty Cash</h4>

        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#expenseModal">
            Add Expense
        </button>

        <button class="btn btn-secondary mb-3 ms-2" data-bs-toggle="modal" data-bs-target="#headModal">
            Add Expense Head
        </button>

        <table class="table table-bordered" id="expenseTable"></table>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal fade" id="expenseModal">
        <div class="modal-dialog">
            <div class="modal-content p-3">

                <h5>Add Expense</h5>

                <select id="expenseHead" class="form-control mb-2"></select>
                <input id="expenseAmount" class="form-control mb-2" placeholder="Amount">
                <input id="expenseDate" type="date" class="form-control mb-2">
                <input id="expenseNotes" class="form-control mb-2" placeholder="Notes">

                <button class="btn btn-success" onclick="createExpense()">Save</button>

            </div>
        </div>
    </div>

    <!-- Add Expense Head Modal -->
    <div class="modal fade" id="headModal">
        <div class="modal-dialog">
            <div class="modal-content p-3">

                <h5>Add Expense Head</h5>

                <input id="newHead" class="form-control mb-2" placeholder="Expense Head Name">

                <button class="btn btn-success" onclick="createHead()">Save</button>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/petty_cash.js"></script>
    <script>
        init("{{csrf_token}}", {
            cash: "/operation-api/petty-cash-api/",
            heads: "/operation-api/expense-head-api/"
        })
    </script>

  </div>
</nav>

</body>

</html>
